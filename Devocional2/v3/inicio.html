<body>

  <div class="container">

    <main class="main-content">

      <article>

        <header class="header">

          <h1>📖 Devocionais Semanais</h1>

          <div class="actions">

            <input type="text" id="searchInput" placeholder="Buscar por tema, texto ou data..." aria-label="Buscar devocionais" class="hidden">

            <button id="newDevocionalBtn" aria-label="Adicionar novo devocional">

              <span class="material-icons">add</span>

              <span>Novo Devocional</span>

            </button>

            <button id="toggleDarkMode" title="Alternar tema claro/escuro" aria-label="Alternar tema">

              <span class="material-icons">brightness_6</span>

            </button>

          </div>

        </header>



        <section class="devocional-do-dia" id="devocionalDia" aria-live="polite">

          <h2>Devocional da Semana</h2>

          <div id="infoDevocional">Carregando devocional...</div>

        </section>



        <section class="historico" aria-labelledby="historico-titulo">

          <h2 id="historico-titulo">Histórico de Devocionais</h2>

          <div class="historico-container" role="list">

            <!-- O conteúdo será inserido aqui pelo JavaScript -->

          </div>

        </section>

      </article>

    </main>

  </div>



  <!-- Modal Novo/Editar Devocional -->

  <div id="modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true">

    <div class="modal-content">

      <h2 id="modal-titulo">Novo Devocional</h2>

      <input type="date" id="inputData" required aria-label="Data do devocional">

      <input type="text" id="inputTema" placeholder="Tema do Devocional" required aria-label="Tema do devocional">

      <textarea id="inputTexto" placeholder="Digite o texto do devocional..." required aria-label="Texto do devocional"></textarea><!---

<input type="text" id="inputMinistradoPor" placeholder="Ministrado por..." aria-label="Nome do ministrante" required>-->

<div class="ministrante-checkboxes">

  <label><input type="radio" name="ministradoPor" value="Maicon"> Maicon</label>

  <label><input type="radio" name="ministradoPor" value="Daniel Feix"> Daniel Feix</label>

  <label><input type="radio" name="ministradoPor" value="outro" id="radioOutro"> Outro:</label>

  <input type="text" id="inputMinistradoPor" placeholder="Digite o nome..." disabled>

</div>





      <div class="modal-actions">

        <button id="cancelarBtn" aria-label="Cancelar">

          <span class="material-icons">cancel</span>

          <span>Cancelar</span>

        </button>

        <button id="salvarBtn" aria-label="Salvar devocional">

          <span class="material-icons">save</span>

          <span>Salvar</span>

        </button>

      </div>

    </div>

  </div>

<!-- Modal para visualização do texto completo --

<div id="modalTexto" class="modal hidden" aria-hidden="true">

  <div class="modal-content">

    <h2>Texto do Devocional</h2>

    <div id="modalTextoConteudo" style="white-space: pre-wrap;"></div>

    <div class="modal-actions">

      <button onclick="fecharModalTexto()" class="fechar-texto-btn">

        <span class="material-icons">close</span> Fechar

      </button>

    </div>

  </div>

</div>-->

<div id="modalTexto" class="modal hidden">

  <div class="modal-content">

    <h2>Texto Completo</h2>

    <p id="modalTextoConteudo">Nenhum texto disponível.</p>

    <div class="modal-actions">

      <button class="fechar-texto-btn" onclick="fecharModalTexto()">Fechar</button>

    </div>

  </div>

</div>





<div id="loginModal" class="modal hidden">

  <div class="modal-content">

    <h2>Autenticação</h2>

   <input type="text" id="usuarioLogin" name="usuarioLogin" autocomplete="off">



    <input type="password" id="senhaLogin" placeholder="Senha">

    <div class="modal-actions">

      <button id="confirmarLogin">Confirmar</button>

      <button onclick="fecharLoginModal()">Cancelar</button>

    </div>

  </div>

</div>

<!-- Adicione este modal no final do body -->

<div id="confirmarExclusaoModal" class="modal hidden">

  <div class="modal-content">

    <h2>Confirmar Exclusão</h2>

    <p>Tem certeza que deseja excluir este devocional?</p>

    <div class="modal-actions">

      <button id="cancelarExclusaoBtn">Cancelar</button>

      <button id="confirmarExclusaoBtn">Confirmar</button>

    </div>

  </div>

</div>
