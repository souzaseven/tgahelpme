# Exemplo de proxy reverso para o Downloader.
# Ajuste server_name e os caminhos; TLS via certbot (bloco 443 abaixo).

upstream baixa_video {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name baixa.exemplo.com;

    # A API só recebe JSON pequeno; o app já limita, isto é a 1ª barreira.
    client_max_body_size 16k;

    # Arquivos estáticos servidos direto pelo nginx (mais rápido).
    location /static/ {
        alias /opt/baixa-video/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://baixa_video;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;   # download/conversão + stream SSE de progresso
        proxy_buffering       off;    # necessário para SSE e para o streaming do arquivo
        chunked_transfer_encoding on;
    }
}

