services:
  app:
    build: .
    image: baixa-video:latest
    env_file: .env
    environment:
      # Sobrepõe o .env para o container (produção atrás de proxy).
      APP_ENV: production
      APP_DEBUG: "false"
      HOST: 0.0.0.0
      WEB_CONCURRENCY: "1"   # rate limit é por processo; ver README
    ports:
      - "127.0.0.1:8000:8000"   # só o nginx do host acessa
    volumes:
      - tempdata:/app/storage/temp
      # Cookies opcionais (somente leitura). Aponte INSTAGRAM_COOKIES_FILE
      # para /secrets/cookies.txt no .env se for usar.
      # - ./secrets:/secrets:ro
    restart: unless-stopped

volumes:
  tempdata:
    # Alternativa efêmera (em RAM), se o volume de disco não for desejado:
    #   driver_opts: { type: tmpfs, device: tmpfs }
