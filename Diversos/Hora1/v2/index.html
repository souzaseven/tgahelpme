    <!-- Aplica o tema salvo ANTES de renderizar (evita o flash de tema errado) -->
    <script>
        (function () {
            var theme;
            try {
                theme = localStorage.getItem('theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
            } catch (e) {
                theme = 'dark';
            }
            document.documentElement.dataset.theme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#131210' : '#f7f4ee');
        })();
    </script>

    <!-- Tipografia (carregada sem bloquear a renderização) -->

</head>
<body>
    <div class="page">

        <header class="masthead">
            <h1 class="masthead__brand">Hora Certa</h1>
            <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Alternar entre tema claro e escuro">
                <span class="theme-toggle__label">Escuro</span>
            </button>
        </header>

        <main class="clock">
            <p class="greeting" id="greeting">Olá</p>

            <div class="time" id="time">
                <span class="time__hm">--:--</span><span class="time__sec">--</span>
            </div>

            <p class="date" id="date">Carregando data…</p>
            <p class="place" id="place">Localizando…</p>
            <p class="status" id="status" role="status" aria-live="polite" hidden></p>

            <section class="progress">
                <div class="progress__track" id="progressTrack" role="progressbar"
                     aria-label="Progresso do dia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress__fill" id="progressFill"></div>
                </div>
                <div class="progress__meta">
                    <span>00:00</span>
                    <span class="progress__now" id="progressLabel">—</span>
                    <span>24:00</span>
                </div>
            </section>

            <dl class="details">
                <div class="details__row"><dt>Condição</dt><dd id="d-cond">—</dd></div>
                <div class="details__row"><dt>Sensação</dt><dd id="d-feels">—</dd></div>
                <div class="details__row"><dt>Mín / Máx</dt><dd id="d-minmax">—</dd></div>
                <div class="details__row"><dt>Nascer do sol</dt><dd id="d-sunrise">—</dd></div>
                <div class="details__row"><dt>Pôr do sol</dt><dd id="d-sunset">—</dd></div>
                <div class="details__row"><dt>Fuso horário</dt><dd id="d-tz">—</dd></div>
            </dl>
        </main>

        <footer class="colophon">
            <details class="settings">
                <summary>Ajustes</summary>
                <div class="settings__group">
                    <label class="settings__opt">
                        <input type="checkbox" id="opt-hour12"> Formato 12&nbsp;h
                    </label>
                    <label class="settings__opt">
                        <input type="checkbox" id="opt-seconds"> Mostrar segundos
                    </label>
                </div>
            </details>

            <nav class="colophon__links">
                <a href="privacidade.html">Privacidade</a>
            </nav>

            <img class="colophon__hits" loading="lazy" width="120" height="26" alt="Contador de visitas"
                 referrerpolicy="no-referrer" onerror="this.style.display='none'"
                 src="https://hits.sh/tgameajuda.com/diversos/hora1.html.svg?color=888888&label=visitas&labelColor=FFFFFF">
        </footer>

    </div>
