<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-qrcode"></i> Gerador de QR Code</h1>
            <p class="subtitle">Crie QR Codes personalizados no modo escuro</p>
        </div>
        
        <div class="form-group">
            <select id="tamanho">
                <option value="1">Tamanho: 1</option>
                <option value="2">Tamanho: 2</option>
                <option value="3">Tamanho: 3</option>
                <option value="4">Tamanho: 4</option>
                <option value="5" selected>Tamanho: 5</option>
                <option value="6">Tamanho: 6</option>
                <option value="7">Tamanho: 7</option>
                <option value="8">Tamanho: 8</option>
                <option value="9">Tamanho: 9</option>
                <option value="10">Tamanho: 10</option>
            </select>

            <select id="errorlevel">
                <option value="L">Nível de erro: L (7%)</option>
                <option value="M" selected>Nível de erro: M (15%)</option>
                <option value="Q">Nível de erro: Q (25%)</option>
                <option value="H">Nível de erro: H (30%)</option>
            </select>

            <div class="color-picker-wrapper">
                <input type="text" id="corqr" class="color-picker" placeholder="Cor QR (#000000)" value="#ffffff">
                <input type="color" id="colorqrpicker" value="#ffffff">
                <i class="fas fa-palette color-icon" onclick="document.getElementById('colorqrpicker').click()"></i>
            </div>

            <div class="color-picker-wrapper">
                <input type="text" id="corbg" class="color-picker" placeholder="Cor do fundo (#ffffff)" value="#000000">
                <input type="color" id="colorbgpicker" value="#000000">
                <i class="fas fa-palette color-icon" onclick="document.getElementById('colorbgpicker').click()"></i>
            </div>

            <input type="text" id="qrcodetxt" placeholder="Digite o texto ou URL aqui" class="input-text">
        </div>

        <!-- Botões alinhados lado a lado -->
        <div class="button-group">
            <button class="btn" onclick="generateQRCode()"><i class="fas fa-qrcode"></i> Gerar QR Code</button>
            <button id="download-btn" class="btn" style="display: none;" onclick="downloadQRCode()"><i class="fas fa-download"></i> Baixar</button>
        </div>

        <!-- Container para o QR Code -->
        <div id="qrcode"></div>
    </div>

    <footer>
        <!-- Contador de visitas -->
        <div class="visitor-counter">
            <img src="https://hits.sh/tgameajuda.com/tgasugestao/editasugestao0.html.svg?color=007ced&label=visitas&labelColor=FFFFFF&logo=https%3A%2F%2Fraw.githubusercontent.com%2Fsouzaseven%2Ftgahelpme%2FDesafios%2Ficon%2520bot%2520tga.ico" 
                 alt="Contador de visitas">
        </div>
    </footer>

    <!-- Biblioteca QR Code e Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

    <!-- Script -->
    <script src="./js/script.js"></script>
</body>
