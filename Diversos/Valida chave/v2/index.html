<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisa Chave de Acesso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Analisa Chave de Acesso</h1>
        <p>Insira a chave de acesso da nota fiscal (44 dígitos):</p>
        <input type="text" id="chaveAcesso" placeholder="Ex: 5123124060480900014765002000001088100030298" maxlength="44">

        <div class="resultados">
        
            <div class="bloco" id="uf">
                <h2>UF</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="anoMes">
                <h2>Ano e Mês</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="cnpj">
                <h2>CNPJ</h2>
                <p>-</p>
            </div>
    <div class="bloco" id="tipoNota">
                <h2>Tipo de Nota</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="serie">
                <h2>Série</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="numero">
                <h2>Número</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="tipoEmissao">
                <h2>Tipo de Emissão</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="codigoNumerico">
                <h2>Código Numérico</h2>
                <p>-</p>
            </div>
            <div class="bloco" id="digitoVerificador">
                <h2>Dígito Verificador</h2>
                <p>-</p>
            </div>
        </div>

        <div class="documento">
            <h2>Documento:</h2>
            <p id="nomeDocumento">-</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
