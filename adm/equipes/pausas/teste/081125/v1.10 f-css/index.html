<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pausa - Equipe Daniel</title>

  <!-- Ícone e Font Awesome -->
  <link rel="icon" href="https://tgameajuda.com/img/principal/bot-tga.webp" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 🔧 Setup de versão automática (sempre detecta a pasta atual) -->
  <script src="./setup_sistema.php"></script>
  <!-- Se o HTML estiver dentro da pasta da versão, ele sobe um nível -->
  <!-- Exemplo: /adm/equipes/pausas/v1.5/index.html -> carrega /adm/equipes/pausas/v1.5/setup_sistema.php -->

  <!--souza system-->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8542251167876044" crossorigin="anonymous"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8EC5C2WTG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-S8EC5C2WTG');
  </script>

  <!-- Carregar CSS dinamicamente com base na versão detectada -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const versao = window.SISTEMA_CONFIG?.versao || (() => {
        // 🔹 fallback automático: pega a pasta atual
        const path = window.location.pathname.split("/");
        return path[path.indexOf("pausas") + 1] || "v1.0";
      })();
      const baseCSS = window.SISTEMA_CONFIG?.caminhos?.css || `/adm/equipes/pausas/${versao}/css/`;
      console.log(`🎨 Carregando CSS da versão ${versao} →`, baseCSS);

      const estilos = [
        "core.css",
        "components.css",
        "animations.css",
        "notificacoes.css",
        "contador_pausa.css"
      ];

      estilos.forEach(arq => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = baseCSS + arq + `?v=${versao}&t=${Date.now()}`;
        document.head.appendChild(link);
      });
    });
  </script>
</head>

<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-clock"></i> Controle de Pausa</h1>
      <p class="subtitle">Equipe Daniel Feix</p>

      <div class="status-bar">
        <div class="status-item">
          <div class="status-indicator online"></div>
          <span>Sistema Online</span>
        </div>
        <div class="status-item">
          <div class="status-indicator sync"></div>
          <span id="sync-status">Sincronizando...</span>
        </div>
        <div class="status-item">
          <i class="fas fa-database"></i>
          <span>Banco de Dados Conectado</span>
        </div>
      </div>
    </header>

    <!-- Painéis -->
    <div class="dashboard">
      <div class="card pausa-container">
        <h2><i class="fas fa-coffee"></i> Em Pausa</h2>
        <div class="contador">
          <i class="fas fa-users"></i>
          <span id="contador-pausa">0</span> de 2 vagas ocupadas
        </div>
        <div id="pausa-lista">
          <div class="lista-vazia">
            <i class="fas fa-mug-hot" style="font-size: 2.5rem; margin-bottom: 15px; opacity: 0.5;"></i>
            <div>Nenhuma pessoa em pausa no momento ☕</div>
          </div>
        </div>
      </div>

      <div class="card lista-espera-container">
        <h2><i class="fas fa-list-ol"></i> Lista de Espera</h2>
        <div class="contador">
          <i class="fas fa-clock"></i>
          <span id="contador-espera">0</span> pessoas aguardando
        </div>
        <div id="lista-espera">
          <div class="lista-vazia">
            <i class="fas fa-clipboard-list" style="font-size: 2.5rem; margin-bottom: 15px; opacity: 0.5;"></i>
            <div>Nenhuma pessoa na lista de espera 📋</div>
          </div>
        </div>
      </div>

      <div class="card participantes-container full-width">
        <h2><i class="fas fa-users"></i> Participantes</h2>
        <div class="participantes-grid" id="listaParticipantes">
          <div class="lista-vazia">
            <div class="loading"></div>
            <div style="margin-top: 15px;">Carregando participantes...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contador de visitas -->
  <div style="display: flex; justify-content: center; margin: 10px 0;">
    <img alt="visitas"
      src="https://hits.sh/tgameajuda.com/adm/equipes/pausas/auto.html.svg?color=007ced&label=visitas&labelColor=FFFFFF&logo=https%3A%2F%2Fraw.githubusercontent.com%2Fsouzaseven%2Ftgahelpme%2FDesafios%2Ficon%2520bot%2520tga.ico"/>
  </div>

  <!-- Carregar scripts dinamicamente -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const versao = window.SISTEMA_CONFIG?.versao || (() => {
        const path = window.location.pathname.split("/");
        return path[path.indexOf("pausas") + 1] || "v1.0";
      })();

      const baseJS = window.SISTEMA_CONFIG?.caminhos?.js || `/adm/equipes/pausas/${versao}/js/`;
      console.log(`🧩 Carregando JS da versão ${versao} →`, baseJS);

      const scripts = [
        "autenticacao.js",
        "contador_pausa.js",
        "contador_espera.js",
        "controle_pausa.js",
        "diagnostico_sistema.js",
        "main.js"
      ];

      const carregados = new Set();
      scripts.forEach(arquivo => {
        if (carregados.has(arquivo)) {
          console.warn(`🟡 [Aviso] Script duplicado ignorado: ${arquivo}`);
          return;
        }
        carregados.add(arquivo);
        const script = document.createElement("script");
        script.src = baseJS + arquivo + `?v=${versao}&t=${Date.now()}`;
        script.defer = true;
        document.body.appendChild(script);
      });
    });
  </script>
</body>
</html>
