<header class="topo">
    <div class="topo-flex">
        <h1>Operadores</h1>
        <button class="btn-primary" onclick="window.location.href='criar.html'">
            + Criar Operador
        </button>
    </div>
</header>

<main class="container">

    <div class="barra-filtros">
        <input
            type="text"
            id="buscaAgente"
            placeholder="Buscar por nome, login ou fila"
            onkeyup="filtrarAgentes()"
        >
    </div>

    <table class="tabela-operadores">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>Autenticação multifator</th>
                <th>Filas</th>
                <th>Status</th>
                <th>Último login</th>
                <th class="acoes">Ações</th>
            </tr>
        </thead>
        <tbody id="lista-agentes">
            <tr>
                <td colspan="7">Carregando operadores...</td>
            </tr>
        </tbody>
    </table>

</main>
