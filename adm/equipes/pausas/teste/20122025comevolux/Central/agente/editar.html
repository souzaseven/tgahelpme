<body>

<header class="page-header">
    <h1>Editar Agente</h1>
    <p>Selecione um agente na lista e edite seus dados cadastrais.</p>
</header>

<main class="container">

    <!-- LISTA / FILTROS -->
    <section class="card">

        <div class="lista-header">
            <h2>👥 Agentes</h2>

            <button
                type="button"
                class="btn-sec"
                onclick="toggleAgruparFila()"
            >
                Agrupar por fila
            </button>
        </div>

        <!-- FILTROS PRINCIPAIS -->
        <div class="filtros-row">
            <input
                type="text"
                id="busca"
                placeholder="Filtrar por nome ou login"
                autocomplete="off"
            >

            <select id="filtro-fila">
                <option value="">Todas as filas</option>
            </select>
        </div>

        <!-- FILTROS AVANÇADOS -->
        <div class="filtros-avancados">
            <label class="check">
                <input type="checkbox" id="filtro-arquivados">
                Mostrar arquivados
            </label>

<label class="check">
    <input
        type="checkbox"
        id="filtro-offline"
        checked
        onchange="aplicarFiltros()"
    >
    Mostrar offline / deslogados
</label>

        </div>

        <!-- CONTADOR -->
        <div id="contador-filas" class="muted"></div>

        <!-- LISTA -->
        <div id="lista-agentes" class="lista-agentes">
            <p class="muted">Carregando agentes...</p>
        </div>
    </section>

</main>

<!-- MODAL OVERLAY -->
<div id="modal-overlay" class="modal-overlay hidden"></div>

<!-- MODAL EDIÇÃO -->
<div id="modal-edicao" class="modal hidden">
    <div class="modal-card">

        <header class="modal-header">
            <h2>✏️ Editar Agente</h2>
            <button type="button" class="modal-close" onclick="fecharModal()">×</button>
        </header>

        <form id="form-editar-agente">

            <div class="form-grid">
                <div class="full">
                    <label>
                        Nome Completo
                        <input type="text" id="nome" required>
                    </label>
                </div>

                <label>
                    Login
                    <input type="text" id="login" required>
                </label>


                <div class="full">
                    <label>
                        Fila
                        <input type="text" id="fila">
                    </label>
                </div>
            </div>

            <div class="actions">
                <button type="submit">Salvar Alterações</button>
                <button type="button" class="btn-sec" onclick="fecharModal()">Cancelar</button>
            </div>

            <div id="resultado-edicao"></div>
        </form>

    </div>
</div>
