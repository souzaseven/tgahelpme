<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Filas • Evolux</title>

    <!-- Favicon -->
    <link rel="icon" href="https://tgameajuda.com/img/principal/bot-tga.webp" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=1.0.3">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Tag Manager -->
    <script>
        (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
            var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s),
                dl = l != 'dataLayer' ? '&l=' + l : '';
            j.async = true;
            j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
            f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-K2XFNTVZ');
    </script>

    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8542251167876044"
        crossorigin="anonymous"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E7ZNTJSRYR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E7ZNTJSRYR');
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8EC5C2WTG"></script>
    <script>
        gtag('config', 'G-S8EC5C2WTG');
    </script>
</head>

<body>

    <!-- Contador de visitas -->
    <img
        alt="visitas"
        src="https://hits.sh/tgameajuda.com/apievoluxcontroledefila.svg?color=007ced&label=visitas&labelColor=FFFFFF&logo=https%3A%2F%2Fraw.githubusercontent.com%2Fsouzaseven%2Ftgahelpme%2FDesafios%2Ficon%2520bot%2520tga.ico"
    />

    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-headset"></i>
                </div>
                <div>
                    <h1>Gerenciamento de Filas</h1>
                    <p class="subtitle">
                        Evolux • Painel Administrativo —
                        <span id="totalGeral">Carregando...</span>
                    </p>
                </div>
            </div>

            <div class="header-actions">
                <span class="user-logado">
                    👤 Operador
                </span>

                <button class="btn-refresh" onclick="carregar()" title="Atualizar dados">
                    <i class="fas fa-sync-alt"></i>
                    <span>Atualizar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Status Summary -->
        <div class="summary-cards">
            <div class="card status-card">
                <div class="status-icon"><i class="fas fa-users"></i></div>
                <div class="status-info">
                    <h3 id="totalOperadores">0</h3>
                    <p>Operadores Ativos</p>
                </div>
            </div>

            <div class="card status-card">
                <div class="status-icon"><i class="fas fa-layer-group"></i></div>
                <div class="status-info">
                    <h3 id="totalEquipes">0</h3>
                    <p>Equipes</p>
                </div>
            </div>

            <div class="card status-card">
                <div class="status-icon"><i class="fas fa-stream"></i></div>
                <div class="status-info">
                    <h3 id="totalFilas">0</h3>
                    <p>Filas Disponíveis</p>
                </div>
            </div>
        </div>

        <!-- Operators -->
        <div class="operators-container">
            <div class="section-header">
                <h2><i class="fas fa-list-ul"></i> Gerenciamento por Equipe</h2>
                <div class="view-controls">
                    <button class="btn-expand-all" onclick="expandirTodasEquipes()">
                        <i class="fas fa-expand-alt"></i> Expandir Todas
                    </button>
                    <button class="btn-collapse-all" onclick="recolherTodasEquipes()">
                        <i class="fas fa-compress-alt"></i> Recolher Todas
                    </button>
                </div>
            </div>

            <div id="listaOperadores" class="teams-grid">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Carregando equipes e operadores...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bulk Actions -->
    <div class="bulk-actions-bar" id="bulkActions">
        <div class="bulk-content">
            <div class="bulk-info">
                <span><strong id="bulkCount">0</strong> selecionados</span>
                <button onclick="limparSelecao()">Limpar</button>
            </div>

            <div class="bulk-controls">
                <select id="fila_bulk"></select>
                <button onclick="aplicarFilaSelecionados()">Aplicar</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script type="module" src="js/app.js?v=1.0.3"></script>

</body>
</html>
