    <div class="form-group">
      <input type="text" name="usuario" placeholder="Usuário" required autocomplete="username">
    </div>

    <div class="form-group">
      <input type="password" name="senha" id="senha" placeholder="Senha" required autocomplete="current-password">

    </div>

    <button type="submit" class="btn">Entrar</button>
  </form>

<script>
  function togglePassword() {
    const senha = document.getElementById("senha");
    senha.type = senha.type === "password" ? "text" : "password";
  }

  // Mostra erro se vier ?erro=1 ou ?erro=perm
  if (
    window.location.search.includes('erro=1') ||
    window.location.search.includes('erro=perm')
  ) {
    document.getElementById('erroLogin').style.display = 'block';
  }
</script>
