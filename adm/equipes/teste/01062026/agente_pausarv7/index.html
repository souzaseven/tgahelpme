<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pausar Agente - Evolux</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="frontend/css/style.css">

  <!-- ✅ Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-K2XFNTVZ');
  </script>

  <!-- Google Ads -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8542251167876044"
    crossorigin="anonymous"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E7ZNTJSRYR"></script>

    window.dataLayer = window.dataLayer || [];

    gtag('js', new Date());

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2XFNTVZ"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <div class="card">

    <h1>Painel de Pausa de Agentes</h1>
    <p>Agentes agrupados por fila • atualização automática</p>

    <!-- 🔢 CONTADOR -->
    <div id="contadorStatus" class="contador-status">
      🟢 0 online • 🔴 0 offline
    </div>

    <!-- 🔎 FILTROS -->
    <div class="filtros">

      <input
        type="text"
        id="buscaAgente"
        placeholder="🔍 Buscar agente por nome ou login"
      >

      <select id="filtroFila">
        <option value="all">Todas as filas</option>
        <!-- opções preenchidas via JS -->
      </select>

      <label>
        <input type="checkbox" id="chkInativos">
        Mostrar inativos
      </label>

      <label>
        <input type="checkbox" id="chkOffline">
        Mostrar offline
      </label>

      <label>
        <input type="checkbox" id="chkArquivados">
        Mostrar arquivados
      </label>

    </div>

    <!-- 📂 PAINEL -->
    <div id="painelFilas"></div>

  </div>

  <!-- JS -->
  <script src="frontend/js/pausar.js" defer></script>

</body>
</html>
