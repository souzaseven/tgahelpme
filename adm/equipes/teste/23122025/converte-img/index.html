<body>

<div class="container">
  <h1>Conversor de Imagens</h1>
  <p class="subtitle">Redimensione, converta e visualize antes/depois</p>

  <!-- Upload -->
  <div class="form-group">
    <label>Imagens</label>
    <input type="file" id="upload" accept="image/*" multiple>
  </div>

  <!-- Preview -->
  <div class="form-group" id="previewBox" style="display:none">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="text-center">
        <label>Original</label>
        <img id="previewBefore" style="max-width:100%;border-radius:12px;border:1px solid var(--color-border)">
      </div>
      <div class="text-center">
        <label>Resultado</label>
        <img id="previewAfter" style="max-width:100%;border-radius:12px;border:1px solid var(--color-border)">
      </div>
    </div>
  </div>

  <!-- Resize -->
  <div id="info" class="form-group" style="display:none">
    <div class="message success" id="originalSize"></div>

    <label>Largura (px)</label>
    <input type="number" id="width">

    <label class="mt-1">Altura (px)</label>
    <input type="number" id="height">

    <label class="mt-1" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="lock" checked style="width:auto">
      Manter proporção
    </label>

    <button type="button" onclick="resetarDimensoes()">Resetar dimensões</button>
  </div>

  <!-- Formato -->
  <div class="form-group">
    <label>Formato de saída</label>
    <select id="format">
      <option value="image/png">PNG</option>
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WEBP</option>
      <option value="image/gif">GIF</option>
    </select>
  </div>

  <button onclick="converterLote()">Converter imagens</button>

  <div id="downloads" class="text-center"></div>

  <canvas id="canvas" hidden></canvas>



<!-- Contador de visitas -->
