    </div>
    <button class="btn-download" type="submit">
      <i class="fas fa-download"></i> Baixar MP3
    </button>
  </form>

  <div class="loading" id="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Processando download...</p>
  </div>

  <!-- Anúncio 2 -->
