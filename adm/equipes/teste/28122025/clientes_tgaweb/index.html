<body>

  <!-- ✅ Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2XFNTVZ"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <!-- ================= CONTAINER PRINCIPAL ================= -->
  <div class="container">

    <div class="header">
      <div class="title">
        <h1>Clientes TGA Web — Cadastros</h1>
        <p>Painel administrativo</p>
      </div>
      <button id="btnNew" class="btn primary">+ Novo Cliente</button>
    </div>
<!-- ================= CARDS DE RESUMO ================= -->
<div class="cards" id="cardsResumo">

  <div class="cardResumo">
    <div class="cr-titulo">Total de clientes</div>
    <div class="cr-valor" id="cardTotal">0</div>
  </div>

  <div class="cardResumo">
    <div class="cr-titulo">Firebird 2.5</div>
    <div class="cr-valor" id="cardFb25">0</div>
  </div>

  <div class="cardResumo">
    <div class="cr-titulo">Firebird 5.0</div>
    <div class="cr-valor" id="cardFb50">0</div>
  </div>

  <div class="cardResumo">
    <div class="cr-titulo">Migrados</div>
    <div class="cr-valor" id="cardMigrados">0</div>
  </div>

</div>

    <!-- ================= CARD ================= -->
    <div class="card">

      <!-- ====== FILTROS ====== -->
      <div class="toolbar">
        <input id="q" class="input" placeholder="Buscar (empresa, código, CNPJ, info)" />

        <input id="versao" class="input" placeholder="Versão (ex: 25.12)" />

        <select id="firebird" class="select">
          <option value="">Firebird (todos)</option>
          <option value="2.5">Firebird 2.5</option>
          <option value="5.0">Firebird 5.0</option>
          <option value="outro">Outro</option>
        </select>

        <input id="firebirdLivre" class="input" placeholder="Versão Firebird"
               style="display:none" />

        <select id="perPage" class="select">
          <option value="10">10 / pág</option>
          <option value="20" selected>20 / pág</option>
          <option value="50">50 / pág</option>
          <option value="100">100 / pág</option>
        </select>

        <span id="pageInfo" style="margin-left:auto;color:var(--muted)"></span>
      </div>

      <!-- ====== TABELA ====== -->
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Empresa</th>
              <th>CNPJ</th>
              <th>Versão</th>
              <th>Firebird</th>
              <th>Info</th>
              <th>Usuários</th>
              <th>Atualizado</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="9">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- ====== PAGINAÇÃO ====== -->
      <div class="footerBar">
        <div>
          <button id="prev" class="btn">◀</button>
          <button id="next" class="btn">▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL / TOAST ================= -->
  <div id="modal"></div>
  <div id="toast"></div>

  <!-- ================= SCRIPT PRINCIPAL ================= -->
  <script src="frontend/js/script.js"></script>

  <!-- ================= CONTADOR DE VISITAS ================= -->
  <div style="display:flex;justify-content:center;margin:10px 0;">
    <img alt="visitas"
      src="https://hits.sh/tgameajuda.com/REFORMA_TRIBUTARIA-05012026.html.svg?color=007ced&label=visitas&labelColor=FFFFFF&logo=https%3A%2F%2Fraw.githubusercontent.com%2Fsouzaseven%2Ftgahelpme%2FDesafios%2Ficon%2520bot%2520tga.ico">
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    tgameajuda – Versão 2026.01.07.10
  </footer>

</body>
</html>
