{% extends "shell.html" %}

{% block content %}
<header class="page-head">
    <i class="bi bi-{{ icon }}" aria-hidden="true"></i>
    <h1>{{ label }}</h1>
</header>

<section class="panel">

        </p>
    </div>
</section>
{% endblock %}
