<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Erro 404 — A página que você está tentando acessar não foi encontrada.">
    <title>404 — Página Não Encontrada</title>
    <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg:     #06060e;
        --accent: #6366f1;
        --ac2:    #8b5cf6;
        --glow:   rgba(99,102,241,.55);
        --text:   #f1f5f9;
        --text2:  #94a3b8;
        --text3:  #475569;
        --err:    #f43f5e;
        --glass:  rgba(255,255,255,.035);
        --gb:     rgba(255,255,255,.07);
        --r:      12px;
        --tr:     .22s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior:smooth; }

    body {
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
        background:var(--bg); color:var(--text);
        min-height:100vh; display:flex;
        align-items:center; justify-content:center;
        overflow-x:hidden; padding:3rem 1.5rem; position:relative;
    }

    /* ── Background ── */
    #canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .orb { position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:1; }
    .orb-1 {
        width:clamp(300px,55vw,700px); height:clamp(200px,40vw,500px);
        background:var(--accent); opacity:.06; top:-18%; left:50%; transform:translateX(-50%);
    }
    .orb-2 {
        width:clamp(180px,30vw,380px); height:clamp(180px,30vw,380px);
        background:var(--ac2); opacity:.055; bottom:-12%; right:-6%;
    }
    .grid {
        position:fixed; inset:0; z-index:1; pointer-events:none;
        background-image:
            linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.022) 1px, transparent 1px);
        background-size:64px 64px;
        mask-image:radial-gradient(ellipse 80% 65% at 50% 38%, black 15%, transparent 72%);
    }

    /* ── Container ── */
    .container {
        position:relative; z-index:10; width:100%; max-width:620px;
        display:flex; flex-direction:column; align-items:center; gap:1.5rem;
        text-align:center; animation:pg-enter .9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes pg-enter {
        from { opacity:0; transform:translateY(28px) scale(.97); }
        to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* ── Badge ── */
    .badge {
        display:inline-flex; align-items:center; gap:.5rem;
        padding:.35rem .95rem; background:var(--glass); border:1px solid var(--gb);
        border-radius:100px; font-size:.71rem; font-weight:600;
        letter-spacing:.1em; text-transform:uppercase; color:var(--text2);
        backdrop-filter:blur(12px); animation:fade-in .5s .2s both;
    }
    @keyframes fade-in { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
    .bdot {
        width:6px; height:6px; background:var(--err); border-radius:50%;
        animation:dpulse 2s ease-in-out infinite;
    }
    @keyframes dpulse {
        0%,100% { box-shadow:0 0 0 0 rgba(244,63,94,.7); }
        50%     { box-shadow:0 0 0 5px rgba(244,63,94,0); }
    }

    /* ── 404 ── */
    .e404 {
        position:relative; font-size:clamp(6.5rem,22vw,15rem);
        font-weight:900; letter-spacing:-.04em; line-height:1;
        color:var(--text); user-select:none; overflow:hidden;
        animation:neon 3.5s ease-in-out infinite;
    }
    @keyframes neon {
        0%,100% { text-shadow:0 0 22px var(--glow),0 0 55px var(--glow),0 0 90px rgba(99,102,241,.22); }
        50%     { text-shadow:0 0 8px var(--glow),0 0 24px rgba(99,102,241,.45),0 0 44px rgba(99,102,241,.14); }
    }
    .e404::before {
        content:attr(data-text); position:absolute; inset:0; color:#f0f; opacity:0;
        clip-path:polygon(0 22%,100% 22%,100% 46%,0 46%); animation:ga 5s 1s infinite;
    }
    .e404::after {
        content:attr(data-text); position:absolute; inset:0; color:#0ff; opacity:0;
        clip-path:polygon(0 63%,100% 63%,100% 82%,0 82%); animation:gb 5s 1.12s infinite;
    }
    @keyframes ga {
        0%,86%,100%{transform:translate(0);opacity:0}
        88%{transform:translate(-5px,2px);opacity:1}
        90%{transform:translate(5px,-2px);opacity:1}
        92%{transform:translate(-3px,1px);opacity:.7}
        94%{transform:translate(3px,-1px);opacity:1}
        96%{transform:translate(0);opacity:0}
    }
    @keyframes gb {
        0%,86%,100%{transform:translate(0);opacity:0}
        88%{transform:translate(5px,-2px);opacity:1}
        90%{transform:translate(-5px,2px);opacity:1}
        92%{transform:translate(3px,1px);opacity:.7}
        94%{transform:translate(-3px,-1px);opacity:1}
        96%{transform:translate(0);opacity:0}
    }
    .scanline {
        position:absolute; left:-5%; width:110%; height:3px;
        background:linear-gradient(90deg,transparent,rgba(99,102,241,.55),transparent);
        animation:scan 4s linear infinite; pointer-events:none;
    }
    @keyframes scan { 0%{top:-5%;opacity:.8} 85%{opacity:.5} 100%{top:110%;opacity:0} }

    /* ── Robot image ── */
    .rbt-wrap {
        position:relative; display:inline-block; border-radius:50%;
        animation:rbt-float 3.5s ease-in-out infinite;
    }
    .rbt-wrap::before {
        content:''; position:absolute; inset:-10px; border-radius:50%;
        border:2px solid rgba(20,130,255,.4);
        animation:rbt-ring 3s ease-out infinite; pointer-events:none;
    }
    .rbt-wrap::after {
        content:''; position:absolute; inset:-22px; border-radius:50%;
        border:1.5px solid rgba(20,130,255,.18);
        animation:rbt-ring 3s .6s ease-out infinite; pointer-events:none;
    }
    @keyframes rbt-ring {
        0%  { transform:scale(1);    opacity:.75; }
        70% { transform:scale(1.18); opacity:0;   }
        100%{ transform:scale(1.18); opacity:0;   }
    }
    @keyframes rbt-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .rbt-img {
        display:block;
        width:clamp(170px,46vw,220px);
        height:clamp(170px,46vw,220px);
        border-radius:50%; object-fit:cover; object-position:center center;
        animation:rbt-enter .75s .25s both, rbt-glow 3.5s ease-in-out infinite;
    }
    @keyframes rbt-enter {
        from { opacity:0; transform:scale(.88) translateY(14px); }
        to   { opacity:1; transform:scale(1)   translateY(0);    }
    }
    @keyframes rbt-glow {
        0%,100% { box-shadow:0 0 0 2px rgba(20,130,255,.45),0 0 28px rgba(20,130,255,.38),0 0 55px rgba(20,130,255,.18),0 14px 42px rgba(0,0,0,.55); }
        50%     { box-shadow:0 0 0 2px rgba(20,130,255,.6),0 0 48px rgba(20,130,255,.52),0 0 90px rgba(20,130,255,.25),0 14px 42px rgba(0,0,0,.55); }
    }

    /* ── Content ── */
    .content { display:flex; flex-direction:column; gap:.55rem; animation:sup .7s .42s both; }
    @keyframes sup { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    .title { font-size:clamp(1.3rem,4vw,2rem); font-weight:700; letter-spacing:-.025em; }
    .desc  { font-size:clamp(.86rem,2.4vw,1rem); color:var(--text2); line-height:1.75; max-width:440px; }

    /* ── Construction zone ── */
    .const-wrap {
        width:100%; display:flex; flex-direction:column;
        align-items:center; gap:.6rem;
        animation:sup .7s .56s both;
    }
    .const-scene {
        width:100%; max-width:420px;
        display:flex; align-items:flex-end; gap:.6rem;
    }
    /* CSS traffic cone */
    /* Wrapper handles entrance; inner .cone handles only the sway — no transform conflict */
    .cone-drop {
        flex-shrink:0;
        animation:cone-drop .55s cubic-bezier(.34,1.56,.64,1) .95s both;
    }
    .cone-drop-r { animation-delay:1.2s; }
    @keyframes cone-drop {
        from { opacity:0; transform:translateY(36px) scale(.72); }
        80%  { opacity:1; }
        to   { opacity:1; transform:translateY(0)    scale(1);   }
    }
    .cone {
        width:42px; position:relative;
        animation:cone-sway 3s ease-in-out infinite;
        transform-origin:50% 100%;
    }
    .cone-r { animation-delay:.9s; }
    @keyframes cone-sway {
        0%,100%{ transform:rotate(0deg); }
        33%    { transform:rotate(-5deg); }
        66%    { transform:rotate(4deg); }
    }
    .cone-body {
        width:0; height:0;
        border-left:21px solid transparent;
        border-right:21px solid transparent;
        border-bottom:54px solid #f97316;
        position:relative; margin:0 auto;
    }
    .cone-stripe {
        position:absolute; bottom:-38px; left:-14px;
        width:28px; height:5px;
        background:rgba(255,255,255,.72); border-radius:1px;
    }
    .cone-base {
        width:42px; height:9px;
        background:#ea580c; border-radius:3px; margin-top:0;
    }
    /* Barrier */
    .barrier-col {
        flex:1; display:flex; flex-direction:column;
        align-items:center; gap:.3rem; padding-bottom:9px;
    }
    .warn-light {
        width:13px; height:13px; border-radius:50%;
        background:#fbbf24;
        box-shadow:0 0 8px rgba(251,191,36,.8),0 0 18px rgba(251,191,36,.35);
        animation:warn-blink 1.1s ease-in-out infinite;
    }
    @keyframes warn-blink {
        0%,100%{ opacity:1;  box-shadow:0 0 8px rgba(251,191,36,.8),0 0 18px rgba(251,191,36,.35); }
        50%    { opacity:.18; box-shadow:none; }
    }
    .barrier {
        width:100%; height:26px; border-radius:5px;
        background-image:repeating-linear-gradient(
            -45deg,
            #f97316 0px, #f97316 11px,
            #17141f 11px, #17141f 22px
        );
        background-size:31px 31px;
        border:1px solid rgba(249,115,22,.3);
        box-shadow:0 0 14px rgba(249,115,22,.15);
        animation:stripe-scroll 1.8s linear infinite;
    }
    @keyframes stripe-scroll { to { background-position:31px 0; } }
    .const-label {
        font-size:.75rem; color:var(--text3);
        letter-spacing:.06em; text-transform:uppercase;
    }

    /* ── Redirect countdown ── */
    .redir {
        width:100%; display:flex; flex-direction:column;
        align-items:center; gap:.55rem;
        animation:sup .7s .68s both;
    }
    .redir-text { font-size:.82rem; color:var(--text3); }
    .redir-num {
        display:inline-block; min-width:1.6ch; text-align:center;
        color:var(--accent); font-weight:700;
        font-variant-numeric:tabular-nums;
    }
    .redir-track {
        width:100%; max-width:320px; height:3px;
        background:rgba(255,255,255,.07); border-radius:100px; overflow:hidden;
    }
    .redir-fill {
        height:100%; width:100%;
        background:linear-gradient(90deg, var(--accent), var(--ac2));
        border-radius:100px; transform-origin:left; transform:scaleX(1);
    }

    /* ── Buttons ── */
    .btns { display:flex; flex-wrap:wrap; gap:.7rem; justify-content:center; animation:sup .7s .8s both; }
    .btn {
        display:inline-flex; align-items:center; gap:.45rem; padding:.68rem 1.35rem;
        border-radius:var(--r); font-family:inherit; font-size:.88rem; font-weight:500;
        cursor:pointer; border:none; text-decoration:none; position:relative; overflow:hidden;
        transition:transform var(--tr),box-shadow var(--tr),background var(--tr),border-color var(--tr),color var(--tr);
    }
    .btn svg { width:15px; height:15px; flex-shrink:0; transition:transform var(--tr); }
    .btn:hover svg { transform:scale(1.15); }
    .btn:active    { transform:scale(.97) !important; }
    .btn-p { background:var(--accent); color:#fff; box-shadow:0 4px 18px rgba(99,102,241,.4); }
    .btn-p:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(99,102,241,.55); }
    .btn-s { background:var(--glass); border:1px solid var(--gb); color:var(--text); backdrop-filter:blur(10px); }
    .btn-s:hover { transform:translateY(-2px); border-color:rgba(99,102,241,.35); box-shadow:0 4px 18px rgba(99,102,241,.1); }
    .ripple-el {
        position:absolute; border-radius:50%; background:rgba(255,255,255,.22);
        transform:scale(0); animation:rip .55s linear; pointer-events:none;
    }
    @keyframes rip { to{transform:scale(4);opacity:0} }

    /* ── Responsive ── */
    @media (max-width:520px) {
        body { padding:2rem 1rem; }
        .btns { flex-direction:column; width:100%; }
        .btn  { justify-content:center; width:100%; }
        .rbt-img { width:clamp(150px,44vw,190px); height:clamp(150px,44vw,190px); }
        .const-scene { max-width:320px; }
    }
    @media (max-width:360px) { .e404 { font-size:5.5rem; } }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="grid"></div>

<main class="container" id="container">

    <div class="badge"><span class="bdot"></span>HTTP ERROR 404</div>

    <div class="e404" data-text="404" aria-label="Erro 404">
        404<div class="scanline"></div>
    </div>

    <!-- Robot -->
    <div class="rbt-wrap">
        <img
            src="https://tgameajuda.com/img/principal/bot-tga.webp"
            class="rbt-img"
            alt="Robô assistente"
            loading="eager"
            decoding="async"
        />
    </div>

    <div class="content">
        <h1 class="title">Oops! Página não encontrada</h1>
        <p class="desc">A página que você está tentando acessar não existe, foi removida ou mudou de endereço.</p>
    </div>

    <!-- Construction zone -->
    <div class="const-wrap" aria-hidden="true">
        <div class="const-scene">
            <!-- Left cone -->
            <div class="cone-drop">
                <div class="cone">
                    <div class="cone-body"><div class="cone-stripe"></div></div>
                    <div class="cone-base"></div>
                </div>
            </div>

            <!-- Barrier + light -->
            <div class="barrier-col">
                <div class="warn-light"></div>
                <div class="barrier"></div>
            </div>

            <!-- Right cone -->
            <div class="cone-drop cone-drop-r">
                <div class="cone cone-r">
                    <div class="cone-body"><div class="cone-stripe"></div></div>
                    <div class="cone-base"></div>
                </div>
            </div>
        </div>
        <p class="const-label">&#9888; Área em manutenção</p>
    </div>

    <!-- Auto-redirect countdown -->
    <div class="redir">
        <p class="redir-text">
            Redirecionando ao início em&nbsp;<span class="redir-num" id="redir-num">10</span>s
        </p>
        <div class="redir-track">
            <div class="redir-fill" id="redir-fill"></div>
        </div>
    </div>

    <div class="btns">
        <a href="/" class="btn btn-p" id="btn-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
            Voltar ao Início
        </a>
        <button class="btn btn-s" id="btn-reload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Recarregar
        </button>
    </div>

</main>

<script>
'use strict';

/* ── Particles ── */
(function () {
    const cvs = document.getElementById('canvas');
    const ctx = cvs.getContext('2d');
    let W, H, pts;
    const LINK = 115, SPEED = 0.42, MAX = 75;
    let mx = 0, my = 0;

    function resize() {
        W = cvs.width  = window.innerWidth;
        H = cvs.height = window.innerHeight;
        mx = W / 2; my = H / 2;
        const n = Math.min(Math.floor(W * H / 12500), MAX);
        pts = Array.from({ length: n }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * SPEED, vy: (Math.random() - 0.5) * SPEED,
            r: Math.random() * 1.3 + 0.5, a: Math.random() * 0.35 + 0.08,
            h: Math.random() > 0.5 ? 239 : 262
        }));
    }

    window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    window.addEventListener('resize', resize);
    resize();

    (function frame() {
        ctx.clearRect(0, 0, W, H);
        pts.forEach(p => {
            const dx = mx - p.x, dy = my - p.y, d = Math.hypot(dx, dy);
            if (d < 190) { p.vx += dx / d * 0.011; p.vy += dy / d * 0.011; }
            const spd = Math.hypot(p.vx, p.vy);
            if (spd > 1.1) { p.vx = p.vx / spd * 1.1; p.vy = p.vy / spd * 1.1; }
            p.x += p.vx; p.y += p.vy;
            if (p.x < -8) p.x = W + 8; else if (p.x > W + 8) p.x = -8;
            if (p.y < -8) p.y = H + 8; else if (p.y > H + 8) p.y = -8;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
            ctx.fillStyle = `hsla(${p.h},84%,66%,${p.a})`; ctx.fill();
        });
        for (let i = 0; i < pts.length - 1; i++) {
            for (let j = i + 1; j < pts.length; j++) {
                const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                if (d < LINK) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(99,102,241,${.13 * (1 - d / LINK)})`;
                    ctx.lineWidth = 0.6;
                    ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(frame);
    })();
})();

/* ── Parallax (desktop only) ── */
(function () {
    if (window.matchMedia('(hover: none)').matches) return;
    const el = document.getElementById('container');
    let tx = 0, ty = 0, cx = 0, cy = 0, active = false;
    window.addEventListener('mousemove', e => {
        tx = (e.clientX / window.innerWidth  - 0.5) * 12;
        ty = (e.clientY / window.innerHeight - 0.5) *  8;
    });
    window.addEventListener('mouseleave', () => { tx = 0; ty = 0; });
    setTimeout(() => { active = true; }, 950);
    (function tick() {
        if (active) {
            cx += (tx - cx) * 0.055; cy += (ty - cy) * 0.055;
            el.style.transform = `translate(${cx.toFixed(2)}px,${cy.toFixed(2)}px)`;
        }
        requestAnimationFrame(tick);
    })();
})();

/* ── Auto redirect countdown ── */
const redirectTimer = (function () {
    const numEl  = document.getElementById('redir-num');
    const fillEl = document.getElementById('redir-fill');
    const SECS   = 10;
    let left = SECS;

    /* Start bar animation after two frames so paint has committed */
    requestAnimationFrame(() => requestAnimationFrame(() => {
        fillEl.style.transition = `transform ${SECS}s linear`;
        fillEl.style.transform  = 'scaleX(0)';
    }));

    return setInterval(() => {
        left--;
        numEl.textContent = left;
        if (left <= 0) {
            clearInterval(redirectTimer);
            window.open('https://tgameajuda.com/anuncios/anuncios1.html', '_blank', 'noopener');
            window.location.href = '/';
        }
    }, 1000);
})();

/* ── Buttons ── */
(function () {
    /* Any button click cancels the auto-redirect */
    function cancelRedirect() { clearInterval(redirectTimer); }

    document.getElementById('btn-home').addEventListener('click', cancelRedirect);

    document.getElementById('btn-reload').addEventListener('click', () => {
        cancelRedirect();
        location.reload();
    });

    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const el = document.createElement('span');
            el.className = 'ripple-el';
            el.style.cssText = `width:${size}px;height:${size}px;top:${e.clientY - rect.top - size/2}px;left:${e.clientX - rect.left - size/2}px;`;
            this.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        });
    });
})();
</script>
</body>
</html>
