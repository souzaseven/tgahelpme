        <a href="#" onclick="mostrarMensagem()">Esqueceu a senha?</a>

  <div id="mensagemSenha" class="floating-msg">
    Contate o administrador para redefinir sua senha.
  </div>

  <script>
    function togglePassword() {
      const senha = document.getElementById("senha");
      senha.type = senha.type === "password" ? "text" : "password";
    }
    function mostrarMensagem() {
      const msg = document.getElementById("mensagemSenha");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 4000);
    }
  </script>

<script>
  // Exibe erro se "erro=1" estiver presente na URL
  if (window.location.search.includes('erro=1')) {
    document.getElementById('erroLogin').style.display = 'block';
  }
</script>
