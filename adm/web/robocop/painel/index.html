<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robocopy Script Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="shell">
        <header class="app-header">
            <div class="logo-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                    <rect x="1" y="1" width="9" height="9" rx="2" fill="currentColor" opacity=".9"/>
                    <rect x="12" y="1" width="9" height="9" rx="2" fill="currentColor" opacity=".5"/>
                    <rect x="1" y="12" width="9" height="9" rx="2" fill="currentColor" opacity=".5"/>
                    <rect x="12" y="12" width="9" height="9" rx="2" fill="currentColor" opacity=".9"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>Robocopy Generator</h1>
                <p class="subtitle">Gerador de scripts em lote</p>
            </div>
            <button id="toggleTheme" class="theme-btn" type="button" title="Alternar tema" aria-label="Alternar tema claro/escuro">
                <span id="themeIcon">🌙</span>
            </button>
        </header>

        <main class="main-grid">
            <!-- LEFT: Inputs -->
            <section class="panel" aria-label="Configurações">
                <div class="panel-section">
                    <span class="section-tag">01 — Caminhos</span>
                    <div class="field">
                        <label for="origem">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 013.5 2h2.879a1.5 1.5 0 011.06.44l1.122 1.12A1.5 1.5 0 009.62 4H12.5A1.5 1.5 0 0114 5.5v7A1.5 1.5 0 0112.5 14h-9A1.5 1.5 0 012 12.5v-9z" stroke="currentColor" stroke-width="1.25"/></svg>
                            Origem
                        </label>
                        <input type="text" id="origem" placeholder="S:\PASTA\ORIGEM" value="S:\TGA\TGA\VERSOES\26_05\TGA" spellcheck="false" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="destino">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 013.5 2h2.879a1.5 1.5 0 011.06.44l1.122 1.12A1.5 1.5 0 009.62 4H12.5A1.5 1.5 0 0114 5.5v7A1.5 1.5 0 0112.5 14h-9A1.5 1.5 0 012 12.5v-9z" stroke="currentColor" stroke-width="1.25"/></svg>
                            Destino base
                        </label>
                        <input type="text" id="destino" placeholder="S:\TGA\CODIGOAQUI\TGA" value="S:\TGA\CODIGOAQUI\TGA" spellcheck="false" autocomplete="off">
                        <span class="field-hint">Use <code>CODIGOAQUI</code> como placeholder para os códigos</span>
                    </div>
                </div>

                <div class="panel-section codes-section">
                    <span class="section-tag">02 — Códigos</span>
                    <div id="codesList" class="codes-list"></div>
                    <button type="button" id="btnAdd" class="btn-add">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        Adicionar bloco
                    </button>

                    <div class="panel-actions">
                        <button type="button" id="btnExample" class="btn-secondary" title="Preencher exemplo">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            Exemplo
                        </button>
                        <button type="button" id="btnClear" class="btn-secondary" title="Limpar tudo">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 10.5l5-5M10.5 10.5l-5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            Limpar tudo
                        </button>
                        <select id="modelosCmd" class="btn-secondary" style="min-width:210px" title="Modelos de comandos">
                            <option value="">Modelos de comandos...</option>
                            <option value="fdb">Listar pastas com $TGA.FDB</option>
                            <option value="contabil">Listar pastas com Contabil.exe</option>
                            <option value="folha">Listar pastas com Folha.exe</option>
                            <option value="hotel">Listar pastas com Hotel.exe</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- RIGHT: Output -->
            <section class="panel output-panel" aria-label="Script gerado">
                <div class="output-top">
                    <span class="section-tag">03 — Script gerado</span>
                    <span class="live-badge" aria-live="polite" aria-label="Atualiza em tempo real">
                        <span class="live-dot" aria-hidden="true"></span>
                        Ao vivo
                    </span>
                </div>

                <div class="terminal-wrap">
                    <div class="terminal-bar" aria-hidden="true">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                        <span class="terminal-label">robocopy.bat</span>
                    </div>
                    <textarea id="output" class="terminal-output" readonly spellcheck="false" aria-label="Script Robocopy gerado"></textarea>
                </div>

                <div class="output-actions">
                    <button type="button" id="btnCopy" class="btn-copy">
                        <svg id="copyIcon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.25"/><path d="M3 11H2.5A1.5 1.5 0 011 9.5v-7A1.5 1.5 0 012.5 1h7A1.5 1.5 0 0111 2.5V3" stroke="currentColor" stroke-width="1.25"/></svg>
                        <span id="copyLabel">Copiar script</span>
                    </button>
                    <button type="button" id="btnDownload" class="btn-download">
                        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11v1.5A1.5 1.5 0 003.5 14h9a1.5 1.5 0 001.5-1.5V11" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
                        <span>Baixar .bat</span>
                    </button>
                </div>

                <div class="stats-row" id="statsRow" aria-live="polite">
                    <span class="stat" id="statCodes">0 códigos</span>
                    <span class="stat-sep">·</span>
                    <span class="stat" id="statLines">0 linhas</span>
                </div>

                <div class="history-panel">
                    <div class="history-header">
                        <span>Histórico</span>
                        <button type="button" id="btnClearHistory" class="btn-secondary" title="Limpar histórico">
                            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 10.5l5-5M10.5 10.5l-5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                    <ul id="historyList" class="history-list"></ul>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <span>Robocopy Generator &copy; 2026</span>
        </footer>
    </div>

    <div id="toast" class="toast" aria-live="polite" style="display:none"></div>
    <script src="script.js"></script>
</body>
</html>
