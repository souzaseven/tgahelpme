<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat de Suporte</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --success-color: #4cc9f0;
      --warning-color: #f8961e;
      --danger-color: #f72585;
      --bg-dark: #121212;
      --bg-chat: #1e1e1e;
      --text-light: #f1f1f1;
      --text-muted: #a1a1a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

body {/*
  background-color: var(--bg-dark);*/
  background-image: url(https://tgameajuda.com/tgawallpaper/tga%20black.png);
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center center;
  min-height: 100vh;
  margin: 0;
}


#chat-container {
  max-width: 800px;
  margin: 2rem auto;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  background: var(--bg-chat);
  display: flex;
  flex-direction: column;
  max-height: 90vh;
  height: auto;
}


    .oculto-box {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      max-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #chat-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.2rem;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-box {
      flex: 1;
      max-height: 65vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 1.5rem;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.8rem 1.2rem;
      border-radius: 18px;
      position: relative;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background-color: var(--primary-color);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot-message {
      align-self: flex-start;
      background-color: #2a2a2a;
      color: var(--text-light);
      border-bottom-left-radius: 5px;
    }

    .bot-message.thinking {
      background-color: transparent;
      color: var(--text-muted);
      font-style: italic;
    }

    #chat-form {
      display: flex;
      padding: 1rem;
      background: var(--bg-dark);
      border-top: 1px solid #333;
    }

    #user-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      background-color: #2a2a2a;
      color: var(--text-light);
      border: 1px solid #444;
      border-radius: 25px;
      outline: none;
      font-size: 1rem;
    }

    #user-input::placeholder {
      color: #888;
    }

    #chat-form button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 0 1.5rem;
      margin-left: 0.8rem;
      cursor: pointer;
    }

    #chat-form button:hover {
      background-color: var(--secondary-color);
    }

    .typing-indicator {
      display: inline-flex;
      padding: 0.5rem;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      margin: 0 2px;
      background-color: #6c757d;
      border-radius: 50%;
      opacity: 0.4;
      animation: typingAnimation 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingAnimation {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      text-align: right;
    }

    #toggle-theme {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    body.light-mode {
      background-color: #f1f1f1;
      color: #222;/*
      background-image: none;*/
background-image: url(https://tgameajuda.com/tgawallpaper/tga%20black.png);
    }

    body.light-mode #chat-container {
      background: white;
      color: #222;
    }

    body.light-mode #chat-box {
      background: #f9f9f9;
    }

    body.light-mode .bot-message {
      background-color: #e1e1e1;
      color: #222;
    }

    body.light-mode .user-message {
      background-color: var(--secondary-color);
      color: white;
    }

    body.light-mode #chat-form {
      background: #eee;
      border-top: 1px solid #ccc;
    }

    body.light-mode #user-input {
      background-color: white;
      color: #000;
      border: 1px solid #ccc;
    }

    body.light-mode #user-input::placeholder {
      color: #666;
    }

    body.light-mode .timestamp {
      color: #555;
    }

    @media (max-width: 768px) {
      #chat-container {
        margin: 0;
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <button id="toggle-theme">Modo Claro</button>

    <div id="chat-interior">
      <div id="chat-header">
        <i class="fas fa-robot"></i> Chat de Suporte do TGAMEAJUDA
      </div>

      <div id="chat-conteudo">
        <div id="chat-box"></div>
        <form id="chat-form">
          <input type="text" id="user-input" placeholder="Digite sua pergunta..." required autocomplete="off">
          <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const chatBox = document.getElementById('chat-box');
      const chatForm = document.getElementById('chat-form');
      const userInput = document.getElementById('user-input');
      const chatHeader = document.getElementById('chat-header');
      const chatConteudo = document.getElementById('chat-conteudo');
      const toggleButton = document.getElementById('toggle-theme');

      addMessage('Olá! Sou o assistente virtual do TGAMEAJUDA. Como posso ajudar você hoje?', 'bot-message');

      chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const question = userInput.value.trim();
        if (!question) return;

        addMessage(question, 'user-message');
        userInput.value = '';
        showTypingIndicator();

        try {
          const res = await fetch('chatbot.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pergunta: question })
          });

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`Erro no servidor: ${res.status} - ${errorText || 'Sem detalhes'}`);
          }

          const data = await res.json();
          removeTypingIndicator();

          if (data.resposta) {
            addMessage(data.resposta, 'bot-message');
          } else {
            addMessage('Não recebi uma resposta válida do servidor.', 'bot-message');
          }
        } catch (error) {
          removeTypingIndicator();
          addMessage('Erro ao processar sua pergunta. Tente novamente.', 'bot-message');
          console.error('Erro detalhado:', error);
        }
      });

      function addMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerHTML = text;

        const timestamp = document.createElement('div');
        timestamp.className = 'timestamp';
        timestamp.textContent = getCurrentTime();
        messageDiv.appendChild(timestamp);

        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot-message thinking';
        typingDiv.id = 'typing-indicator';
        typingDiv.innerHTML = `
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>`;
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTypingIndicator() {
        const typingIndicator = document.getElementById('typing-indicator');
        if (typingIndicator) typingIndicator.remove();
      }

      function getCurrentTime() {
        const now = new Date();
        return `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
      }

      toggleButton.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        toggleButton.textContent = document.body.classList.contains('light-mode') ? 'Modo Escuro' : 'Modo Claro';
      });

      chatHeader.addEventListener('click', () => {
        chatConteudo.classList.toggle('oculto-box');
      });
    });
  </script>
</body>
</html>
