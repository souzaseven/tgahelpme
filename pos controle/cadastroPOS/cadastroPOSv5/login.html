    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;

    .btn {

    }

    .forgot-password {
      text-align: center;
      margin-top: 15px;
    }

    .forgot-password a {
      color: red;
 font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .error {
      color: #e74c3c;
      font-size: 14px;
      text-align: center;
      margin-bottom: 10px;
    }

    .floating-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      font-size: 16px;
      z-index: 9999;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -60%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

<body>
  <div class="login-container">
    <h2>Login</h2>
    <form action="login.php" method="POST">
      <div class="form-group">
        <input type="text" name="usuario" placeholder="Usuário" required />
      </div>

      <div class="form-group">
        <input type="password" name="senha" id="senha" placeholder="Senha" required />
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>
<!--
      <?php if (isset($_GET['erro'])) echo '<div class="error">Usuário ou senha inválidos.</div>'; ?>
-->
      <button type="submit" class="btn">Entrar</button>

      <div class="forgot-password">
        <a href="#" onclick="mostrarMensagem()">Esqueceu a senha?</a>
      </div>
    </form>
  </div>

  <div id="mensagemSenha" class="floating-msg">
    Contate o administrador para alterar sua senha.
  </div>

  <script>
    function togglePassword() {
      const senha = document.getElementById("senha");
      senha.type = senha.type === "password" ? "text" : "password";
    }

    function mostrarMensagem() {
      const msg = document.getElementById("mensagemSenha");
      msg.style.display = "block";
      setTimeout(() => {
        msg.style.display = "none";
      }, 4000);
    }
  </script>
</body>
