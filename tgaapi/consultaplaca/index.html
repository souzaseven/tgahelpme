<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta de Placa - Detector Automático</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicativo para consulta de placas de veículos com reconhecimento por câmera">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-car"></i> Consulta de Placa</h1>

    <div class="card">
      <div class="input-group">
        <input type="text" id="placaInput" placeholder="Digite a placa (ex: ABC1234)" maxlength="7">
        <button id="btnConsultar" onclick="consultarPlaca()"><i class="fas fa-search"></i> Consultar</button>
      </div>

      <div class="button-group">
        <button onclick="ativarCamera()"><i class="fas fa-camera"></i> Câmera</button>
        <button onclick="inverterCamera()"><i class="fas fa-sync-alt"></i> Inverter</button>
        <button onclick="pararCamera()"><i class="fas fa-times"></i> Fechar</button>
      </div>

      <div class="camera-container">
        <video id="camera" autoplay muted playsinline></video>
        <button id="btnCapturar" onclick="capturarFoto()"><i class="fas fa-camera"></i> Capturar</button>
      </div>

      <div id="resultado">
        <div class="status-message">Digite uma placa ou use a câmera para reconhecimento automático</div>
      </div>

      <div id="historico">
        <h3><i class="fas fa-history"></i> Histórico</h3>
        <ul id="historicoLista"></ul>
      </div>
    </div>

    <div class="footer">
      <p>Consulta em tempo real via <strong>API Brasil</strong></p>
      <img src="https://profile-counter.glitch.me/consulta-placa-veicular/count.svg" alt="Contador de Visitantes" class="contador">
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script src="script2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</body>
</html>
