<script>
document.addEventListener('DOMContentLoaded', async function () {
    const container = document.getElementById('downloads-dinamicos');
    const extensoes = ['webp', 'png', 'jpg', 'jpeg', 'svg'];

    async function verificarImagem(caminho) {
        try {
            const response = await fetch(caminho, { method: 'HEAD' });
            return response.ok;
        } catch {
            return false;
        }
    }

    function getNomeBase(nomeArquivo) {
        return nomeArquivo.replace(/\.[^/.]+$/, "");
    }

    async function encontrarImagem(nomeBase) {
        for (const ext of extensoes) {
            const caminho = `./IMG/${nomeBase}.${ext}`;
            if (await verificarImagem(caminho)) {
                return caminho;
            }
        }
        return null; // Nenhuma imagem encontrada
    }

  try {
    const res = await fetch('listar_downloads.php');
    const json = await res.json();

    if (json.success) {
        for (const item of json.data) {
            const nomeBase = getNomeBase(item.nome);
            const imagemPath = await encontrarImagem(nomeBase);

            const div = document.createElement('div');
            div.className = 'video-item';

            if (imagemPath) {
                const img = document.createElement('img');
                img.src = imagemPath;
                img.alt = "DOWNLOAD";
                img.className = "responsive-image-Dowloads";
                div.appendChild(img);
            }

            const info = document.createElement('div');
            info.className = 'video-title';
            info.innerHTML = `
                ${item.nome} <br>
                <a href="${item.url}" class="download-link" download>
                    <i class="fa fa-download"></i> DOWNLOAD
                </a>
            `;

            div.appendChild(info);
            container.appendChild(div);
        }

        // Corrigido: esse bloco estava fora do if
        if (typeof filterContent === "function") {
            filterContent();
        }
    } else {
        container.innerHTML = '<p>Erro ao carregar downloads.</p>';
    }
} catch (e) {
    console.error(e);
    container.innerHTML = '<p>Erro na requisição.</p>';
}

});
</script>
