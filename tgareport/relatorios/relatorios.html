<head>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/etiqueta.css">
    <style>
        .file-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: flex-start;
        }

        .file-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            width: calc(25% - 16px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
            text-align: center;
        }

        .file-item strong {
            display: block;
            margin-bottom: 8px;
        }

        .file-item button {
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .file-item {
                width: calc(50% - 16px);
            }
        }

        @media (max-width: 480px) {
            .file-item {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <a href="https://tgameajuda.com/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>

    <div class="search-container">
        <input id="searchInput" type="text" placeholder="Pesquisar arquivo..." oninput="filterFiles()">
    </div>

    <button type="button" onclick="openForm()">Adicionar Novo Arquivo</button>

    <div id="overlay" onclick="closeForm()"></div>
    <div class="form-container" id="formContainer">
        <form id="uploadForm">
            <h2>Adicionar Novo Arquivo</h2>
            <input type="text" name="fileName" id="fileName" placeholder="Nome do arquivo (sem extensão)" required>
            <input type="file" name="file" id="file" accept=".rtm" required onchange="updateFileName()">
            <input type="hidden" name="dataHora" id="dataHora">
            <button type="submit">Enviar</button>
            <button type="button" class="close-btn" onclick="closeForm()">Fechar</button>
        </form>
        <div id="formMessage"></div>
    </div>

    <div class="containers">
        <div id="relatorios" class="container">
            <h2><i class="fas fa-tag"></i> RELATÓRIOS</h2>
            <div id="relatoriosList" class="file-container"></div>
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <button id="scrollToTopBtn" class="scroll-to-top-button"><i class="fas fa-arrow-up"></i></button>

    <script>
        async function carregarArquivos() {
            const errorMessage = document.getElementById('errorMessage');
            try {
                const response = await fetch(`./listar_relatorios.php?_=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                let arquivos;
                try {
                    arquivos = await response.json();
                } catch {
                    throw new Error("Resposta inválida do servidor");
                }

                const relatoriosList = document.getElementById('relatoriosList');
                relatoriosList.innerHTML = '';
                errorMessage.style.display = 'none';

                if (arquivos.erro) {
                    relatoriosList.innerHTML = `<li>${arquivos.erro}</li>`;
                    return;
                }

                arquivos.forEach(arquivo => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `
                        <strong>Arquivo ${arquivo.sequencial}:</strong> ${arquivo.nome_arquivo}<br>
                        <strong>Extensão:</strong> ${arquivo.extensao}<br>
                        <a href="${arquivo.caminho}" class="download" download>
                            <button><i class="fas fa-download"></i> Baixar</button>
                        </a>
                    `;
                    relatoriosList.appendChild(div);
                });
            } catch (error) {
                errorMessage.textContent = `Erro ao carregar os arquivos: ${error.message}`;
                errorMessage.style.display = 'block';
                console.error('Erro ao carregar os arquivos:', error);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const now = new Date();
            const dataHoraFormatada = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('dataHora').value = dataHoraFormatada;

            const formData = new FormData(e.target);

            try {
                const response = await fetch('./uploaderelatorios.php', {
                    method: 'POST',
                    body: formData
                });
                const resultado = await response.json();

                const formMessage = document.getElementById('formMessage');
                formMessage.textContent = resultado.sucesso || resultado.erro;
                formMessage.style.color = resultado.sucesso ? 'green' : 'red';

                if (resultado.sucesso) {
                    carregarArquivos();
                    closeForm();
                }
            } catch (error) {
                console.error('Erro ao enviar arquivo:', error);
                const formMessage = document.getElementById('formMessage');
                formMessage.textContent = 'Erro ao enviar o arquivo: ' + error.message;
                formMessage.style.color = 'red';
            }
        });

        document.addEventListener('DOMContentLoaded', carregarArquivos);

        function openForm() {
            document.getElementById('formContainer').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeForm() {
            document.getElementById('formContainer').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function updateFileName() {
            const fileInput = document.getElementById('file');
            const fileName = fileInput.files[0]?.name.split('.')[0] || '';
            document.getElementById('fileName').value = fileName;
        }

 function filterFiles() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const relatoriosList = document.getElementById('relatoriosList');
    if (!relatoriosList) return;

    // Se seus arquivos estiverem em <div class="file-item">, por exemplo:
    const files = relatoriosList.querySelectorAll('.file-item');
    
    files.forEach(file => {
        const textContent = file.textContent.toLowerCase();
        file.style.display = textContent.includes(searchTerm) ? 'block' : 'none';
    });
}

    </script>
</body>

</html>
