<body>
    <a href="https://tgameajuda.com/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
<h1></h1>
    <div class="search-container">
        <input id="searchInput" type="text" placeholder="Pesquisar script..." oninput="filterFiles()">
    </div>

    <div style="text-align: center; margin: 10px; color: #f44336; font-weight: bold;">
        De preferência, envie um arquivo de texto ou adicione digitando o comando e salvando.
    </div>

    <button onclick="openForm()">Adicionar Novo Script</button>

   <div id="formContainer" class="form-container">
    <form id="uploadForm">
        <h2>Adicionar Novo Script</h2>
        <label for="titulo">Título do Script</label>
        <input type="text" name="titulo" id="titulo" placeholder="Título do Script" required>
        
        <label for="texto">Escreva seu Script SQL (opcional)</label>
        <textarea name="texto" id="texto" rows="5" placeholder="Digite o comando SQL aqui"></textarea>
        
        <label for="file">Ou envie um arquivo SQL</label>
        <input type="file" name="file" id="file" accept=".sql" onchange="updateFileName()">
        
        <input type="hidden" name="dataHora" id="dataHora">
        <button type="submit">Enviar</button>
        <button type="button" class="close-btn" onclick="closeForm()">Fechar</button>
    </form>
    <div id="formMessage"></div>
</div>

    <div class="containers">
        <div id="sqlContainer" class="container">
            <h2><i class="fas fa-database"></i> SCRIPTS SQL</h2>
            <ul id="sqlList"></ul>
        </div>
    </div>

    <button id="scrollToTopBtn" class="scroll-to-top-button"><i class="fas fa-arrow-up"></i> </button>

    <!-- Modal para exibir o conteúdo do script -->
    <div id="scriptModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">Fechar</button>
            <h3 id="scriptTitle"></h3>
            <textarea id="scriptText" readonly></textarea>
            <button onclick="copyToClipboard()">Copiar Texto</button>
        </div>
    </div>

    <!-- Modal para selecionar formato de download -->
    <div id="downloadModal">
        <div class="modal-content">
            <h3>Escolha o formato do download</h3>
            <div class="modal-buttons">
                <button onclick="confirmDownload('txt')">.txt</button>
                <button onclick="confirmDownload('sql')">.sql</button>
                <button class="close-btn" onclick="closeDownloadModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let currentDownloadPath = '';
        let currentDownloadName = '';

async function carregarArquivos() {
    try {
        // Use o nome correto do arquivo PHP
        const response = await fetch(`./listar_arquivossql.php?nocache=${Date.now()}`);
        
        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }

        const arquivos = await response.json();

        const sqlList = document.getElementById('sqlList');
        sqlList.innerHTML = '';

        if (!Array.isArray(arquivos) || arquivos.length === 0) {
            sqlList.innerHTML = `<li>Nenhum arquivo encontrado.</li>`;
            return;
        }

  arquivos.forEach(arquivo => {
    const li = document.createElement('li');
    li.innerHTML = `
        <strong>Título:</strong> ${arquivo.arquivo}<br>
        <!-- <strong>Adicionado:</strong> ${arquivo.adicionadoPor || 'N/A'}<br> --><br>
        <button onclick="verScript('${arquivo.caminho}', '${arquivo.arquivo}')">Ver Script</button>
        <button onclick="abrirDownloadModal('${arquivo.caminho}', '${arquivo.arquivo}')">Baixar</button>
        <button style="background-color:#f44336; color:white;" onclick="confirmarExclusao('${arquivo.caminho}', '${arquivo.nome_arquivo}.sql')">Excluir</button>
    `;
    sqlList.appendChild(li);
});

    } catch (error) {
        console.error('Erro ao carregar os arquivos:', error);
        const sqlList = document.getElementById('sqlList');
        sqlList.innerHTML = `<li>Erro ao carregar os arquivos: ${error.message}</li>`;
    }
}



        async function verScript(caminho, titulo) {
            try {
                const response = await fetch(caminho);
                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                const texto = await response.text();

                document.getElementById('scriptTitle').innerText = titulo;
                document.getElementById('scriptText').value = texto;
                document.getElementById('scriptModal').style.display = 'flex';
            } catch (error) {
                alert('Erro ao carregar o script: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('scriptModal').style.display = 'none';
        }

        function copyToClipboard() {
            const texto = document.getElementById('scriptText');
            texto.select();
            document.execCommand('copy');
            alert('Texto copiado para a área de transferência!');
        }

        function abrirDownloadModal(caminho, nome) {
            currentDownloadPath = caminho;
            currentDownloadName = nome;
            document.getElementById('downloadModal').style.display = 'flex';
        }

        function confirmDownload(extensao) {
            const novoNome = currentDownloadName.replace('.txt', `.${extensao}`);
            const link = document.createElement('a');
            link.href = currentDownloadPath;
            link.download = novoNome;
            link.click();
            closeDownloadModal();
        }

        function closeDownloadModal() {
            document.getElementById('downloadModal').style.display = 'none';
        }

        function openForm() {
            document.getElementById('formContainer').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeForm() {
            document.getElementById('formContainer').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

       function updateFileName() {
    const fileInput = document.getElementById('file');
    const fileName = fileInput.files[0]?.name.split('.')[0] || '';
    document.getElementById('titulo').value = fileName;
}


   document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const now = new Date();
    const dataHoraFormatada = `${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
    document.getElementById('dataHora').value = dataHoraFormatada;

    const formData = new FormData(e.target);
    const formMessage = document.getElementById('formMessage');

    try {
        const response = await fetch('./uploadsql.php', {
            method: 'POST',
            body: formData
        });
        const resultado = await response.json();

        if (resultado.sucesso) {
    formMessage.textContent = 'Arquivo salvo com sucesso!';
    formMessage.style.color = 'green';

    // Adiciona o novo arquivo diretamente na lista

    const li = document.createElement('li');
    li.innerHTML = `
        <strong>Título:</strong> ${document.getElementById('titulo').value}.txt<br>
       <!-- <strong>Adicionado:</strong> ${document.getElementById('dataHora').value}   -->    <br>
        <button onclick="verScript('./uploads/${document.getElementById('titulo').value}.txt', '${document.getElementById('titulo').value}.txt')">Ver Script</button>
        <button onclick="abrirDownloadModal('./uploads/${document.getElementById('titulo').value}.txt', '${document.getElementById('titulo').value}.txt')">Baixar</button>
    `;
    sqlList.appendChild(li);*/
const tituloOriginal = document.getElementById('titulo').value;
const tituloSanitizado = tituloOriginal.replace(/[^\w\-]/g, '_');
const sqlList = document.getElementById('sqlList');
const li = document.createElement('li');
li.innerHTML = `
    <strong>Título:</strong> ${tituloOriginal}.txt<br>
    <button onclick="verScript('./uploads/${tituloSanitizado}.txt', '${tituloOriginal}.txt')">Ver Script</button>
    <button onclick="abrirDownloadModal('./uploads/${tituloSanitizado}.txt', '${tituloOriginal}.txt')">Baixar</button>
    <button onclick="confirmarExclusao('./uploads/${tituloSanitizado}.txt', '${tituloOriginal}.txt')">Excluir</button>
    <button style="background-color:#f44336; color:white;" onclick="confirmarExclusao('./uploads/${tituloSanitizado}.txt', '${tituloOriginal}.txt')">Excluir</button>
`;


    // Fecha o modal após 2 segundos
    setTimeout(() => {
        formMessage.textContent = '';
        closeForm(); // Fecha o modal
    }, 2000);
}
 else {
            formMessage.textContent = resultado.erro || 'Erro ao salvar o arquivo.';
            formMessage.style.color = 'red';
        }
    } catch (error) {
        console.error('Erro ao enviar o script:', error);
        formMessage.textContent = 'Erro ao enviar o script: ' + error.message;
        formMessage.style.color = 'red';
    }
});




        function filterFiles() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const arquivos = document.querySelectorAll('#sqlList li');

            arquivos.forEach(arquivo => {
             /*  const texto = arquivo.textContent.toLowerCase();
                arquivo.style.display = texto.includes(searchValue) ? '' : 'none';*/
const texto = arquivo.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[_\-]/g, ' ');
const busca = searchValue.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[_\-]/g, ' ');
arquivo.style.display = texto.includes(busca) ? '' : 'none';

            });
        }

        document.addEventListener('DOMContentLoaded', carregarArquivos);

function confirmarExclusao(caminho, nomeArquivo) {
    const usuario = prompt("Digite o nome de usuário:");
    const senha = prompt("Digite a senha:");

    if (!usuario || !senha) {
        alert("Usuário e senha são obrigatórios.");
        return;
    }

    const formData = new FormData();
    formData.append("usuario", usuario);
    formData.append("senha", senha);
    formData.append("arquivo", caminho);

    fetch("sql.php", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(resultado => {
        if (resultado.sucesso) {
            alert("Arquivo excluído com sucesso!");
            carregarArquivos(); // Recarrega a lista
        } else {
            alert(resultado.erro || "Erro ao excluir arquivo.");
        }
    })
    .catch(error => {
        console.error("Erro:", error);
        alert("Erro na exclusão.");
    });
}


    </script>
