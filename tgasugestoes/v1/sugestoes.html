<style>
/* Adiciona estilos para exibir o aviso em segundo plano */
#sucesso-toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #4CAF50;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    font-family: sans-serif;
    z-index: 9999;
    opacity: 0;
    transform: translateX(100%);
    transition: opacity 0.5s ease, transform 0.5s ease;
}





.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  width: 100%;
}

.form-grid label,
.form-grid input,
.form-grid textarea,
.form-grid select {
  width: 100%;
}

.form-grid-full {
  grid-column: 1 / -1;
}

@media (max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

#sucesso-toast.mostrar {
    opacity: 1;
    transform: translateX(0);
}



</style>

    <h1>Painel de Sugestões</h1>
    <div id="status-message"></div> <!-- Aqui aparecerá a mensagem de sucesso -->
    <!---->
  <form id="suggestion-form" method="POST" enctype="multipart/form-data">
  <div class="form-grid">
    <div>
      <label for="nome">Seu Nome:</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div>
      <label for="email">Seu E-mail:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-grid-full">
      <label for="resumo">Resumo da Sugestão:</label>
      <textarea id="resumo" name="resumo" rows="2" required></textarea>
    </div>

    <div class="form-grid-full">
      <label for="sugestao">Descrição Detalhada:</label>
      <textarea id="sugestao" name="sugestao" rows="4" required></textarea>
    </div>

    <div class="form-grid-full">
      <label for="imagem">Imagem (opcional):</label>
      <input type="file" id="imagem" name="imagem" accept="image/*">
      <div id="preview" style="margin-top:10px;"></div>
    </div>

    <div class="form-grid-full" style="text-align:center;">
      <button type="submit">Enviar Sugestão</button>
    </div>
  </div>
</form>
<div id="sucesso-toast"></div>



    <script>
        // Preencher o formulário com os dados armazenados no localStorage (se houver)
        window.onload = function() {
            var nome = localStorage.getItem('nome');
            var email = localStorage.getItem('email');

            if (nome) {
                document.getElementById('nome').value = nome;
            }

            if (email) {
                document.getElementById('email').value = email;
            }
        };

        document.getElementById('suggestion-form').addEventListener('submit', function(e) {
            e.preventDefault();  // Evita o envio tradicional do formulário

            var formData = new FormData(this);
            var statusMessage = document.getElementById('status-message');
            
            // Salvar nome e email no localStorage
            var nome = document.getElementById('nome').value;
            var email = document.getElementById('email').value;

            localStorage.setItem('nome', nome);
            localStorage.setItem('email', email);

            // Envia o formulário via AJAX
            fetch('salvar_sugestao.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
.then(data => {
    mostrarMensagemSucesso("Sugestão criada com sucesso!");
})


            .catch(error => {
                statusMessage.innerHTML = '<p>Erro ao salvar a sugestão. Tente novamente.</p>';
                statusMessage.style.color = 'red';
            });
        });

// Suporte à colagem de imagem (Ctrl+V)
document.addEventListener('paste', function (e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let item of items) {
        if (item.type.indexOf("image") === 0) {
            const file = item.getAsFile();
            const input = document.getElementById('imagem');
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            input.files = dataTransfer.files;

            const reader = new FileReader();
            reader.onload = function (event) {
                document.getElementById('preview').innerHTML = '<img src="' + event.target.result + '" style="max-width:100%;margin-top:10px;">';
            };
            reader.readAsDataURL(file);
        }
    }
});

// Mostra preview da imagem quando selecionada via botão
document.getElementById('imagem').addEventListener('change', function () {
    const file = this.files[0];
    if (file && file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function (event) {
            document.getElementById('preview').innerHTML = '<img src="' + event.target.result + '" style="max-width:100%;margin-top:10px;">';
        };
        reader.readAsDataURL(file);
    }
});





    </script>


<script>
function mostrarMensagemSucesso(mensagem) {
    const toast = document.getElementById('sucesso-toast');
    toast.innerHTML = mensagem;
    toast.classList.add('mostrar');

    // Após 2 segundos, redireciona
    setTimeout(() => {
        window.location.href = 'consultasugestao.php';
    }, 2000);
}

</script>
